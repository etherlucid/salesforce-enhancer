<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom GIF Uploader - Salesforce Enhancer</title>
  <style>
    :root {
      --primary: #0176d3;
      --primary-hover: #014486;
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 100%;
      min-height: 100vh;
      background: #f1f5f9;
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      padding: 32px 16px;
    }
    .page-card {
      max-width: 660px;
      margin: 0 auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px 28px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
    }
    .page-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .page-tab-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--subtext);
      cursor: pointer;
    }
    .page-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .mod-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .mod-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .mod-item-left {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .mod-item-left input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    .mod-item-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mod-item-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: #ffffff;
      color: #475569;
      border: 1px solid var(--border);
    }
    .mod-item-desc {
      font-size: 11px;
      color: var(--subtext);
      margin-top: 2px;
    }
    .mod-item-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header-icon {
      font-size: 26px;
      line-height: 1;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .header-subtitle {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 2px;
    }
    .dropzone {
      border: 2px dashed var(--border-dark);
      border-radius: 8px;
      background: var(--surface);
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
      user-select: none;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(1, 118, 211, 0.05);
    }
    .dropzone-icon {
      font-size: 30px;
      margin-bottom: 6px;
    }
    .dropzone-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .dropzone-subtext {
      font-size: 11px;
      color: var(--subtext);
    }
    .or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 8px 0 12px 0;
      color: var(--subtext);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .or-divider span {
      padding: 0 10px;
    }
    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .url-input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .url-input:focus {
      border-color: var(--primary);
    }
    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-neutral {
      background: #ffffff;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-neutral:hover {
      background: #f1f5f9;
      border-color: var(--border-dark);
    }
    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .preview-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext);
    }
    .preview-file-info {
      font-size: 11px;
      color: var(--subtext);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 96px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }
    .preview-box-empty {
      font-size: 12px;
      color: var(--subtext);
      font-style: italic;
    }
    .preview-img {
      max-height: 80px;
      max-width: 90%;
      object-fit: contain;
    }
    @keyframes spin-preview {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .size-btn-group {
      display: flex;
      gap: 4px;
    }
    .size-btn {
      padding: 3px 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text);
    }
    .size-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }
    .rotate-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
    }
    .status-msg {
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .status-msg.success {
      display: block;
      background: var(--success-bg);
      color: #065f46;
      border: 1px solid var(--success-border);
    }
    .status-msg.error {
      display: block;
      background: var(--error-bg);
      color: #991b1b;
      border: 1px solid var(--error-border);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="page-card">
    <div class="page-tabs">
      <button type="button" class="page-tab-btn" id="tabBtnMods">🧩 Inspector Mods</button>
      <button type="button" class="page-tab-btn" id="tabBtnGif">🎬 Loading Animation</button>
    </div>

    <div class="header">
      <span class="header-icon" id="headerIcon">🎬</span>
      <div>
        <div class="header-title" id="headerTitle">Custom Loading Animation</div>
        <div class="header-subtitle" id="headerSubtitle">Select an animated GIF or image to display during Salesforce load states.</div>
      </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <!-- Big Clickable & Draggable Dropzone -->
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">📁</div>
      <div class="dropzone-text" id="dropzoneText">Click to choose a file or drag & drop here</div>
      <div class="dropzone-subtext" id="dropzoneSubtext">Supports .gif, .png, .jpg, .webp, .svg</div>
    </div>
    <input type="file" id="uploaderFileInput" accept="image/*" style="display:none;">

    <div id="gifControlsSection">
      <div class="or-divider">
        <span>OR ENTER URL</span>
      </div>

      <div class="url-row">
        <input type="text" id="uploaderUrlInput" class="url-input" placeholder="https://example.com/animation.gif">
        <button type="button" class="btn btn-neutral" id="btnLoadUrl">Load URL</button>
      </div>

      <!-- Live Preview Card -->
      <div class="preview-card">
        <div class="preview-header">
          <span class="preview-title">Live Preview</span>
          <span class="preview-file-info" id="previewFileInfo">No image selected</span>
        </div>
        <div class="preview-box" id="previewBox">
          <span class="preview-box-empty" id="previewEmpty">No custom image loaded</span>
          <img src="" id="previewImg" class="preview-img" style="display:none;" alt="Loading Preview">
        </div>

        <div class="options-row">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:11px; color:var(--subtext); font-weight:600;">SIZE:</span>
            <div class="size-btn-group" id="sizeBtnGroup">
              <button type="button" class="size-btn" data-size="48">48px</button>
              <button type="button" class="size-btn active" data-size="64">64px</button>
              <button type="button" class="size-btn" data-size="96">96px</button>
              <button type="button" class="size-btn" data-size="128">128px</button>
            </div>
          </div>

          <label class="rotate-label">
            <input type="checkbox" id="chkRotate">
            <span>Spin while loading</span>
          </label>
        </div>
      </div>
    </div>

    <div id="modControlsSection" style="display:none; flex-direction:column;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
        <span class="preview-title">Installed Mods</span>
        <button type="button" class="btn btn-neutral" id="btnExportAllMods" style="padding:4px 8px; font-size:11px; display:none;">Export All</button>
      </div>
      <div class="mod-list" id="pageInstalledModsList"></div>

      <div class="or-divider">
        <span>OR PASTE / EDIT MOD JSON</span>
      </div>
      <textarea id="modJsonTextarea" placeholder="Paste .mod.json content here..." style="width:100%; min-height:160px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:11px; resize:vertical; margin-bottom:12px;"></textarea>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-neutral" id="btnClose">Close Tab</button>
      <button type="button" class="btn btn-primary" id="btnSaveApply">Save & Apply</button>
    </div>
  </div>

  <script src="uploader.js"></script>
</body>
</html>
