<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom GIF Uploader - Salesforce Enhancer</title>
  <style>
    :root {
      --primary: #0176d3;
      --primary-hover: #014486;
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header-icon {
      font-size: 26px;
      line-height: 1;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .header-subtitle {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 2px;
    }
    .dropzone {
      border: 2px dashed var(--border-dark);
      border-radius: 8px;
      background: var(--surface);
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
      user-select: none;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(1, 118, 211, 0.05);
    }
    .dropzone-icon {
      font-size: 30px;
      margin-bottom: 6px;
    }
    .dropzone-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .dropzone-subtext {
      font-size: 11px;
      color: var(--subtext);
    }
    .or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 8px 0 12px 0;
      color: var(--subtext);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .or-divider span {
      padding: 0 10px;
    }
    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .url-input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .url-input:focus {
      border-color: var(--primary);
    }
    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-neutral {
      background: #ffffff;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-neutral:hover {
      background: #f1f5f9;
      border-color: var(--border-dark);
    }
    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .preview-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext);
    }
    .preview-file-info {
      font-size: 11px;
      color: var(--subtext);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 96px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }
    .preview-box-empty {
      font-size: 12px;
      color: var(--subtext);
      font-style: italic;
    }
    .preview-img {
      max-height: 80px;
      max-width: 90%;
      object-fit: contain;
    }
    @keyframes spin-preview {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .size-btn-group {
      display: flex;
      gap: 4px;
    }
    .size-btn {
      padding: 3px 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text);
    }
    .size-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }
    .rotate-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
    }
    .status-msg {
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .status-msg.success {
      display: block;
      background: var(--success-bg);
      color: #065f46;
      border: 1px solid var(--success-border);
    }
    .status-msg.error {
      display: block;
      background: var(--error-bg);
      color: #991b1b;
      border: 1px solid var(--error-border);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🎬</span>
    <div>
      <div class="header-title">Custom Loading Animation</div>
      <div class="header-subtitle">Select an animated GIF or image to display during Salesforce load states.</div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <!-- Big Clickable & Draggable Dropzone -->
  <div class="dropzone" id="dropzone" title="Click to choose file or drag & drop here">
    <div class="dropzone-icon">📁</div>
    <div class="dropzone-text">Click to choose a GIF / image or drag & drop here</div>
    <div class="dropzone-subtext">Supports .gif, .png, .jpg, .webp, .svg (animated GIFs recommended)</div>
  </div>
  <input type="file" id="uploaderFileInput" accept="image/*" style="display:none;">

  <div class="or-divider">
    <span>OR ENTER URL</span>
  </div>

  <div class="url-row">
    <input type="text" id="uploaderUrlInput" class="url-input" placeholder="https://example.com/animation.gif">
    <button type="button" class="btn btn-neutral" id="btnLoadUrl">Load URL</button>
  </div>

  <!-- Live Preview Card -->
  <div class="preview-card">
    <div class="preview-header">
      <span class="preview-title">Live Preview</span>
      <span class="preview-file-info" id="previewFileInfo">No image selected</span>
    </div>
    <div class="preview-box" id="previewBox">
      <span class="preview-box-empty" id="previewEmpty">No custom image loaded</span>
      <img src="" id="previewImg" class="preview-img" style="display:none;" alt="Loading Preview">
    </div>

    <div class="options-row">
      <div style="display:flex; align-items:center; gap:6px;">
        <span style="font-size:11px; color:var(--subtext); font-weight:600;">SIZE:</span>
        <div class="size-btn-group" id="sizeBtnGroup">
          <button type="button" class="size-btn" data-size="48">48px</button>
          <button type="button" class="size-btn active" data-size="64">64px</button>
          <button type="button" class="size-btn" data-size="96">96px</button>
          <button type="button" class="size-btn" data-size="128">128px</button>
        </div>
      </div>

      <label class="rotate-label">
        <input type="checkbox" id="chkRotate">
        <span>Spin while loading</span>
      </label>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-neutral" id="btnClose">Close</button>
    <button type="button" class="btn btn-primary" id="btnSaveApply">Save & Apply</button>
  </div>

  <script src="uploader.js"></script>
</body>
</html>
